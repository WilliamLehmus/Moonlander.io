<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moonlander.io</title>
</head>

<body>
  <!-- Splash Screen Overlay -->
  <div id="splashScreen" class="splash-overlay">
    <img src="/splash_screen.png" alt="Moonlander.io Splash Screen">
    <div class="splash-text">Click anywhere to start</div>
  </div>

  <!-- Lobby Screen -->
  <div id="lobby">
    <h1>Moonlander.io</h1>
    <p class="subtitle">Cooperative Lunar Mining</p>

    <div class="nickname-section">
      <input type="text" id="nickname" placeholder="Enter Nickname" maxlength="15" />
    </div>

    <div class="lobby-buttons">
      <button id="createBtn">Create Game</button>

      <div class="divider">or</div>

      <div class="join-section">
        <input type="text" id="joinCode" placeholder="Enter room code" maxlength="6" />
        <button id="joinBtn">Join Game</button>
      </div>
    </div>

    <p id="lobbyError" class="error"></p>
    <p id="lobbyStatus" class="status"></p>

    <div class="lobby-footer">
      Released under the <a href="https://opensource.org/licenses/MIT" target="_blank">MIT License</a>
    </div>
  </div>

  <!-- Room Code Display (shown after creating/joining) -->
  <div id="roomInfo" class="hidden">
    <span>Room: <span id="roomCode"></span></span>
    <span id="playerCount"></span>
    <button id="leaveBtn">Leave</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="game" class="hidden"></canvas>

  <!-- Escape Menu -->
  <div id="escapeMenu" class="modal hidden">
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-group">
        <label for="masterVolume">Master Volume</label>
        <input type="range" id="masterVolume" min="0" max="100" value="100">
      </div>
      <div class="setting-group">
        <label for="musicVolume">Music Volume</label>
        <input type="range" id="musicVolume" min="0" max="100" value="100">
      </div>
      <div class="setting-group">
        <label for="sfxVolume">Sound Effects</label>
        <input type="range" id="sfxVolume" min="0" max="100" value="100">
      </div>
      <div class="setting-group">
        <label for="notificationVolume">Notification Volume</label>
        <input type="range" id="notificationVolume" min="0" max="100" value="50">
      </div>
      <button id="resumeBtn">Resume Game</button>
      <button id="quitBtn" class="danger">Quit to Lobby</button>
    </div>
  </div>

  <!-- Station Menu -->
  <div id="stationMenu" class="modal hidden">
    <div class="modal-content station-content">
      <h2>Moon Base Operations</h2>

      <div class="station-tabs">
        <button class="tab-btn active" data-tab="hangar">Hangar</button>
        <button class="tab-btn" data-tab="construction">Construction</button>
      </div>

      <div id="tab-hangar" class="station-tab active">
        <h3>Available Ships</h3>
        <div class="ship-list" id="shipList">
          <!-- Ship items injected here via JS -->
        </div>
        <div id="hangarStatus" class="status-msg"></div>
      </div>

      <div id="tab-construction" class="station-tab hidden">
        <h3>Base Upgrades</h3>
        <div class="building-list" id="buildingList">
          <!-- Buildings injected here -->
        </div>
      </div>

      <button id="closeStationBtn">Close</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
